# Actualiza automáticamente los datos del portal cada semana
# (también se puede ejecutar a mano desde la pestaña "Actions" de GitHub).
name: Actualizar datos

on:
  schedule:
    - cron: "0 11 * * 1"   # lunes 6:00 a. m. hora de Lima (11:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      # Cada paso sigue aunque otro falle: si una web oficial está caída,
      # se conservan los datos anteriores de esa sección.
      - name: Presupuesto (MEF)
        continue-on-error: true
        working-directory: scripts
        run: python -u actualizar_presupuesto.py

      - name: Asistencia del Congreso (actas del Senado y Diputados)
        continue-on-error: true
        working-directory: scripts
        run: python -u actualizar_congreso.py

      - name: Visitas al Despacho Presidencial
        continue-on-error: true
        working-directory: scripts
        run: python -u actualizar_visitas.py

      - name: Guardar cambios
        run: |
          git config user.name "robot-transparencia"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos actualizados $(TZ=America/Lima date +'%Y-%m-%d')"
            git push
          fi
