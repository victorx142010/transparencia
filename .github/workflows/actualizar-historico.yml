# Procesa el presupuesto de años anteriores (2020–2025). Esos años casi no cambian,
# así que se corre a mano (pestaña Actions → Actualizar histórico → Run workflow)
# y, por si acaso, una vez al mes. Cada año se procesa en paralelo.
name: Actualizar histórico

on:
  schedule:
    - cron: "0 8 1 * *"    # día 1 de cada mes, 3:00 a. m. hora de Lima
  workflow_dispatch:

permissions:
  contents: write

jobs:
  anio:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        anio: [2020, 2021, 2022, 2023, 2024, 2025]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Procesar ${{ matrix.anio }}
        working-directory: scripts
        run: python -u actualizar_historico.py --anio ${{ matrix.anio }}
      - uses: actions/upload-artifact@v4
        with:
          name: historico-${{ matrix.anio }}
          path: data/historico/${{ matrix.anio }}.json

  guardar:
    needs: anio
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: actualizar-datos
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          path: descargas
      - name: Juntar años
        run: |
          mkdir -p data/historico
          find descargas -name '*.json' -exec cp {} data/historico/ \;
          cd scripts && python -u actualizar_historico.py --indice
      - name: Guardar cambios
        run: |
          git config user.name "robot-transparencia"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historico/
          if git diff --cached --quiet; then
            echo "Sin cambios."
          else
            git commit -m "Histórico del presupuesto actualizado $(TZ=America/Lima date +'%Y-%m-%d')"
            git pull --rebase -X theirs origin main
            git push
          fi
