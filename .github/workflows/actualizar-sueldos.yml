# Actualiza las planillas (sueldos por persona) de ~1,400 entidades cada semana
# (también se puede ejecutar a mano desde la pestaña "Actions" de GitHub).
name: Actualizar sueldos

on:
  schedule:
    - cron: "0 9 * * 0"    # domingo 4:00 a. m. hora de Lima (09:00 UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: actualizar-datos
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r scripts/requirements.txt

      - name: Sueldos por persona (Portal de Transparencia Estándar)
        working-directory: scripts
        run: python -u actualizar_sueldos.py --hilos 6

      - name: Guardar cambios
        run: |
          git config user.name "robot-transparencia"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/sueldos.json data/sueldos/
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Sueldos actualizados $(TZ=America/Lima date +'%Y-%m-%d')"
            git pull --rebase -X theirs origin main   # por si hubo cambios mientras corría
            git push
          fi
